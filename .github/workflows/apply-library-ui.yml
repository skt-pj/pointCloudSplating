name: Apply library UI wiring

on:
  push:
    branches:
      - agent/android-depth-prior-3dgs
    paths:
      - .github/workflows/apply-library-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/android-depth-prior-3dgs
      - name: Wire library menu
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/sktpj/pointcloudsplatting/ScannerActivity.java')
          text = path.read_text()

          replacements = [
              (
                  'import android.content.Context;\n',
                  'import android.content.Context;\nimport android.content.Intent;\n'
              ),
              (
                  '    private static final int MENU_COPY_DATASET_PATH = 2;\n',
                  '    private static final int MENU_COPY_DATASET_PATH = 2;\n'
                  '    private static final int MENU_LIBRARY = 3;\n'
              ),
              (
                  '        popup.getMenu().add(0, MENU_COPY_DATASET_PATH, 1, "保存先をコピー");\n',
                  '        popup.getMenu().add(0, MENU_COPY_DATASET_PATH, 1, "保存先をコピー");\n'
                  '        popup.getMenu().add(0, MENU_LIBRARY, 2, "ライブラリ");\n'
              ),
              (
                  '            if (item.getItemId() == MENU_COPY_DATASET_PATH) {\n'
                  '                String path = getCurrentDatasetPath();\n'
                  '                copyText("pointCloudSplating dataset", path);\n'
                  '                Toast.makeText(this, "保存先をコピーしました", Toast.LENGTH_SHORT).show();\n'
                  '                return true;\n'
                  '            }\n'
                  '            return false;\n',
                  '            if (item.getItemId() == MENU_COPY_DATASET_PATH) {\n'
                  '                String path = getCurrentDatasetPath();\n'
                  '                copyText("pointCloudSplating dataset", path);\n'
                  '                Toast.makeText(this, "保存先をコピーしました", Toast.LENGTH_SHORT).show();\n'
                  '                return true;\n'
                  '            }\n'
                  '            if (item.getItemId() == MENU_LIBRARY) {\n'
                  '                startActivity(new Intent(this, LibraryActivity.class));\n'
                  '                return true;\n'
                  '            }\n'
                  '            return false;\n'
              ),
          ]

          for old, new in replacements:
              if new in text:
                  continue
              if old not in text:
                  raise SystemExit(f'expected ScannerActivity fragment not found: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/sktpj/pointcloudsplatting/ScannerActivity.java
          git diff --cached --quiet && exit 0
          git commit -m "wire 3DGS library into scanner menu"
          git push origin HEAD:agent/android-depth-prior-3dgs
