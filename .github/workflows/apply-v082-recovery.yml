name: Apply v0.8.2 recovery patch

on:
  push:
    branches:
      - 'agent/**'
    paths:
      - '.github/workflows/apply-v082-recovery.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'add v0.8.2 recovery patch workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Patch ARCore resume ordering and fallback depth priors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Scanner lifecycle: the EGL context is intentionally destroyed for 3DGS processing.
          # Do not reuse the old surfaceCreated state; wait for onSurfaceCreated() to create a
          # valid external OES texture before opening SharedCamera again. Also keep camera/AR/GL
          # suspended once a capture has been finalized, since there is nothing left to capture.
          p = Path('app/src/main/java/com/sktpj/pointcloudsplatting/ScannerActivity.java')
          s = p.read_text()

          old = '''    private boolean activityResumed;\n    private boolean surfaceCreated;\n    private boolean cameraOpening;\n'''
          new = '''    private boolean activityResumed;\n    private boolean surfaceCreated;\n    private boolean surfaceViewResumed;\n    private volatile boolean frameFailureLatched;\n    private boolean cameraOpening;\n'''
          if old not in s:
              raise SystemExit('Scanner field anchor not found')
          s = s.replace(old, new, 1)

          old = '''                public void onActive(CameraCaptureSession activeSession) {\n                    DiagnosticLog.i(TAG, "Camera capture session active");\n                    if (activityResumed && !arcoreActive) resumeArCore();\n                }\n'''
          new = '''                public void onActive(CameraCaptureSession activeSession) {\n                    DiagnosticLog.i(TAG, "Camera capture session active");\n                    if (activityResumed && !captureFinalized && !arcoreActive) resumeArCore();\n                }\n'''
          if old not in s:
              raise SystemExit('Scanner onActive anchor not found')
          s = s.replace(old, new, 1)

          old = '''    @Override\n    protected void onResume() {\n        super.onResume();\n        DiagnosticLog.i(TAG, "onResume");\n        activityResumed = true;\n\n        if (!hasCameraPermission()) {\n            requestPermissions(new String[] {Manifest.permission.CAMERA}, CAMERA_PERMISSION_REQUEST);\n            return;\n        }\n        if (session == null && !createSharedArSession()) return;\n\n        surfaceView.onResume();\n        registerDisplayListener();\n        displayGeometryChanged = true;\n        if (surfaceCreated) openCameraForSharing();\n        if (!captureFinalized && !processingModel) showState("準備中", "カメラを準備しています…");\n    }\n'''
          new = '''    @Override\n    protected void onResume() {\n        super.onResume();\n        DiagnosticLog.i(TAG, "onResume");\n        activityResumed = true;\n\n        // A finalized scan never needs the capture stack again. In particular, after the\n        // processing Activity finishes, do not recreate Camera2/ARCore/GL just to show the\n        // result/error UI. This keeps those resources free for the trainer and avoids a stale\n        // ARCore camera texture after the intentionally destroyed EGL context.\n        if (captureFinalized) {\n            DiagnosticLog.i(TAG, "Capture finalized; keeping camera/AR/GL suspended on resume");\n            return;\n        }\n\n        if (!hasCameraPermission()) {\n            requestPermissions(new String[] {Manifest.permission.CAMERA}, CAMERA_PERMISSION_REQUEST);\n            return;\n        }\n        if (session == null && !createSharedArSession()) return;\n\n        // setPreserveEGLContextOnPause(false) means the old texture name is invalid after pause.\n        // Force the camera-open path to wait for onSurfaceCreated(), which creates and binds the\n        // replacement external OES texture before openCameraForSharing() calls setCameraTextureName().\n        surfaceCreated = false;\n        surfaceView.onResume();\n        surfaceViewResumed = true;\n        registerDisplayListener();\n        displayGeometryChanged = true;\n        showState("準備中", "カメラを準備しています…");\n    }\n'''
          if old not in s:
              raise SystemExit('Scanner onResume anchor not found')
          s = s.replace(old, new, 1)

          old = '''    private void resumeArCore() {\n        if (session == null || sharedCamera == null || arcoreActive || !activityResumed) return;\n        try {\n            session.resume();\n            if (datasetCaptureManager != null) datasetCaptureManager.onCameraResumed();\n            arcoreActive = true;\n            sharedCamera.setCaptureCallback(cameraCaptureCallback, cameraHandler);\n            DiagnosticLog.i(TAG, "ARCore resumed with SharedCamera");\n'''
          new = '''    private void resumeArCore() {\n        if (session == null || sharedCamera == null || arcoreActive || !activityResumed\n                || captureFinalized || !surfaceCreated) return;\n        try {\n            session.resume();\n            if (datasetCaptureManager != null) datasetCaptureManager.onCameraResumed();\n            frameFailureLatched = false;\n            arcoreActive = true;\n            sharedCamera.setCaptureCallback(cameraCaptureCallback, cameraHandler);\n            DiagnosticLog.i(TAG, "ARCore resumed with SharedCamera");\n'''
          if old not in s:
              raise SystemExit('Scanner resumeArCore anchor not found')
          s = s.replace(old, new, 1)

          old = '''    @Override\n    protected void onPause() {\n        DiagnosticLog.i(TAG, "onPause");\n        activityResumed = false;\n        unregisterDisplayListener();\n        surfaceView.onPause();\n        synchronized (frameInUseLock) {\n'''
          new = '''    @Override\n    protected void onPause() {\n        DiagnosticLog.i(TAG, "onPause");\n        activityResumed = false;\n        unregisterDisplayListener();\n        // The EGL context is not preserved. Clear this before pausing so onResume cannot open\n        // SharedCamera against the texture id from the destroyed context.\n        surfaceCreated = false;\n        if (surfaceViewResumed) {\n            surfaceView.onPause();\n            surfaceViewResumed = false;\n        }\n        synchronized (frameInUseLock) {\n'''
          if old not in s:
              raise SystemExit('Scanner onPause anchor not found')
          s = s.replace(old, new, 1)

          old = '''    public void onDrawFrame(GL10 gl) {\n        GLES20.glClear(GLES20.GL_COLOR_BUFFER_BIT | GLES20.GL_DEPTH_BUFFER_BIT);\n        if (session == null || !arcoreActive) return;\n'''
          new = '''    public void onDrawFrame(GL10 gl) {\n        GLES20.glClear(GLES20.GL_COLOR_BUFFER_BIT | GLES20.GL_DEPTH_BUFFER_BIT);\n        if (session == null || !arcoreActive || frameFailureLatched) return;\n'''
          if old not in s:
              raise SystemExit('Scanner onDrawFrame guard anchor not found')
          s = s.replace(old, new, 1)

          old = '''            } catch (Throwable t) {\n                DiagnosticLog.e(TAG, "OpenGL/ARCore frame failed", t);\n                showState("撮影を続けられませんでした",\n                        "アプリを開き直してください。直らない場合は診断情報をコピーしてください。");\n            }\n'''
          new = '''            } catch (Throwable t) {\n                // Latch the first fatal frame failure instead of calling Session.update() again\n                // every render frame. onPause still sees arcoreActive=true and pauses the session.\n                frameFailureLatched = true;\n                DiagnosticLog.e(TAG, "OpenGL/ARCore frame failed; frame loop latched", t);\n                showState("撮影を続けられませんでした",\n                        "アプリを開き直してください。直らない場合は診断情報をコピーしてください。");\n            }\n'''
          if old not in s:
              raise SystemExit('Scanner frame catch anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # DatasetCaptureManager: every Raw Depth snapshot is already transformed into the
          # datasetRootAnchor coordinate system. Preserve a few rolling snapshots at finalization
          # as geometry-only priors even when no JPEG happens to be within the per-frame ±250 ms
          # synchronization window.
          p = Path('app/src/main/java/com/sktpj/pointcloudsplatting/DatasetCaptureManager.java')
          s = p.read_text()

          old = '''    private static final int MAX_POSE_SAMPLES = 180;\n    private static final int MAX_DEPTH_SAMPLES = 32;\n'''
          new = '''    private static final int MAX_POSE_SAMPLES = 180;\n    private static final int MAX_DEPTH_SAMPLES = 32;\n    private static final int MAX_FALLBACK_DEPTH_PRIORS = 6;\n'''
          if old not in s:
              raise SystemExit('Dataset constants anchor not found')
          s = s.replace(old, new, 1)

          old = '''    private boolean captureInFlight;\n    private boolean cameraActive = true;\n    private volatile boolean captureEnabled = true;\n'''
          new = '''    private boolean captureInFlight;\n    private boolean cameraActive = true;\n    private boolean fallbackDepthPriorsQueued;\n    private volatile boolean captureEnabled = true;\n'''
          if old not in s:
              raise SystemExit('Dataset state anchor not found')
          s = s.replace(old, new, 1)

          old = '''        synchronized (this) {\n            captureEnabled = false;\n            lastDecision = "capture stopped; finalizing";\n        }\n\n        while (true) {\n'''
          new = '''        synchronized (this) {\n            captureEnabled = false;\n            lastDecision = "capture stopped; finalizing";\n            queueFallbackDepthPriorsLocked();\n        }\n\n        while (true) {\n'''
          if old not in s:
              raise SystemExit('Dataset stopCapture anchor not found')
          s = s.replace(old, new, 1)

          anchor = '''    public synchronized void resumeCapture() {\n        captureEnabled = true;\n        lastDecision = "capture resumed";\n    }\n\n    public void shutdown() {\n'''
          replacement = '''    public synchronized void resumeCapture() {\n        captureEnabled = true;\n        lastDecision = "capture resumed";\n    }\n\n    /**\n     * Saves a small set of root-anchor Raw Depth snapshots for 3DGS initialization. These are\n     * intentionally independent of JPEG timestamp matching: a root-local geometry prior does not\n     * need to be the same instant as a photometric observation. Per-frame PLY remains synchronized\n     * when available; these files only prevent valid rolling depth from being discarded at Save.\n     */\n    private void queueFallbackDepthPriorsLocked() {\n        if (fallbackDepthPriorsQueued || depthSamples.isEmpty()) return;\n\n        List<WorldPointCloudSnapshot> available = new ArrayList<>(depthSamples);\n        int wanted = Math.min(MAX_FALLBACK_DEPTH_PRIORS, available.size());\n        int queued = 0;\n        for (int i = 0; i < wanted; i++) {\n            int sourceIndex = wanted == 1\n                    ? available.size() - 1\n                    : Math.round(i * (available.size() - 1f) / (wanted - 1f));\n            WorldPointCloudSnapshot snapshot = available.get(sourceIndex);\n            if (snapshot == null || snapshot.getPointCount() < 64) continue;\n            File output = new File(captureRoot, String.format(Locale.US,\n                    "depth_prior_%02d_%d.ply", queued + 1, snapshot.getTimestampNs()));\n            writer.execute(() -> {\n                try {\n                    snapshot.writePly(output);\n                    DiagnosticLog.i(TAG,\n                            "Saved fallback depth prior=" + output.getName()\n                                    + " points=" + snapshot.getPointCount());\n                } catch (IOException e) {\n                    DiagnosticLog.w(TAG,\n                            "Failed to save fallback depth prior " + output.getName()\n                                    + ": " + e.getMessage());\n                }\n            });\n            queued++;\n        }\n        fallbackDepthPriorsQueued = queued > 0;\n        DiagnosticLog.i(TAG,\n                "Queued fallback depth priors=" + queued\n                        + " rollingDepthSnapshots=" + available.size());\n    }\n\n    public void shutdown() {\n'''
          if anchor not in s:
              raise SystemExit('Dataset helper insertion anchor not found')
          s = s.replace(anchor, replacement, 1)
          p.write_text(s)

          # VkSplat exporter: consume both synchronized frame PLY and geometry-only fallback priors.
          p = Path('app/src/main/java/com/sktpj/pointcloudsplatting/ColmapDatasetExporter.java')
          s = p.read_text()
          old = '''            File[] depthFiles = dataset.listFiles((dir, name) ->\n                    name.startsWith("frame_") && name.endsWith(".ply"));\n            if (depthFiles == null) depthFiles = new File[0];\n            Arrays.sort(depthFiles, Comparator.comparing(File::getName));\n\n            Map<Long, PointAccumulator> points = collectDepthPoints(depthFiles, 0.05f);\n'''
          new = '''            File[] depthFiles = dataset.listFiles((dir, name) ->\n                    name.endsWith(".ply")\n                            && (name.startsWith("frame_") || name.startsWith("depth_prior_")));\n            if (depthFiles == null) depthFiles = new File[0];\n            Arrays.sort(depthFiles, Comparator.comparing(File::getName));\n            DiagnosticLog.i(TAG, "Depth prior source files=" + depthFiles.length);\n\n            Map<Long, PointAccumulator> points = collectDepthPoints(depthFiles, 0.05f);\n'''
          if old not in s:
              raise SystemExit('Colmap depth filter anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Version bump.
          Path('version.properties').write_text('VERSION_NAME=0.8.2\nVERSION_CODE=22\n')
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/sktpj/pointcloudsplatting/ScannerActivity.java \
                  app/src/main/java/com/sktpj/pointcloudsplatting/DatasetCaptureManager.java \
                  app/src/main/java/com/sktpj/pointcloudsplatting/ColmapDatasetExporter.java \
                  version.properties
          git commit -m 'fix ARCore resume and preserve fallback depth priors'
          git push origin HEAD:${{ github.ref_name }}
