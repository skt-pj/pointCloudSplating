name: Apply v0.8.3 safe UI patch

on:
  push:
    branches:
      - 'agent/**'
    paths:
      - '.github/workflows/apply-v083-safe-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'add v0.8.3 safe UI patch workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply safe-area UI and motion filtering
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Scanner: keep all interactive overlays outside status/cutout/navigation regions.
          p = Path('app/src/main/java/com/sktpj/pointcloudsplatting/ScannerActivity.java')
          s = p.read_text()
          anchor = '''        actionParams.bottomMargin = dp(16);\n        root.addView(actionBar, actionParams);\n    }\n'''
          replacement = '''        actionParams.bottomMargin = dp(16);\n        root.addView(actionBar, actionParams);\n\n        // targetSdk 35+ is edge-to-edge on Android 15+. Keep camera content edge-to-edge,\n        // but move every interactive overlay into the safe drawing region. An extra 20dp\n        // breathing room keeps controls visibly away from the status bar/camera cutout.\n        root.setOnApplyWindowInsetsListener((view, insets) -> {\n            int top = insets.getSystemWindowInsetTop();\n            int bottom = insets.getSystemWindowInsetBottom();\n            int left = insets.getSystemWindowInsetLeft();\n            int right = insets.getSystemWindowInsetRight();\n            if (Build.VERSION.SDK_INT >= 28 && insets.getDisplayCutout() != null) {\n                android.view.DisplayCutout cutout = insets.getDisplayCutout();\n                top = Math.max(top, cutout.getSafeInsetTop());\n                bottom = Math.max(bottom, cutout.getSafeInsetBottom());\n                left = Math.max(left, cutout.getSafeInsetLeft());\n                right = Math.max(right, cutout.getSafeInsetRight());\n            }\n            setFrameMargins(statusCard, left + dp(12), top + dp(20), right + dp(72), 0);\n            setFrameMargins(menuButton, 0, top + dp(20), right + dp(12), 0);\n            setFrameMargins(actionBar, left + dp(12), 0, right + dp(12), bottom + dp(16));\n            setFrameMargins(modeButton, 0, 0, 0, bottom + dp(102));\n            setFrameMargins(feedbackView, left + dp(24), 0, right + dp(24), bottom + dp(162));\n            return insets;\n        });\n        root.post(root::requestApplyInsets);\n    }\n\n    private void setFrameMargins(View view, int left, int top, int right, int bottom) {\n        if (!(view.getLayoutParams() instanceof FrameLayout.LayoutParams)) return;\n        FrameLayout.LayoutParams params = (FrameLayout.LayoutParams) view.getLayoutParams();\n        if (params.leftMargin == left && params.topMargin == top\n                && params.rightMargin == right && params.bottomMargin == bottom) return;\n        params.leftMargin = left;\n        params.topMargin = top;\n        params.rightMargin = right;\n        params.bottomMargin = bottom;\n        view.setLayoutParams(params);\n    }\n'''
          if anchor not in s:
              raise SystemExit('Scanner UI anchor not found')
          s = s.replace(anchor, replacement, 1)
          # Current backend is full training; do not label the primary action as only a preview.
          s = s.replace('gaussianButton.setText("3Dプレビューを作成");', 'gaussianButton.setText("3Dモデルを作成");', 1)
          s = s.replace('gaussianButton.setContentDescription("撮影した写真から3Dプレビューを作成する");', 'gaussianButton.setContentDescription("撮影した写真から3Dモデルを作成する");', 1)
          p.write_text(s)

          # Dataset capture: preserve the quality thresholds but filter short-lived VIO speed spikes.
          p = Path('app/src/main/java/com/sktpj/pointcloudsplatting/DatasetCaptureManager.java')
          s = p.read_text()
          old = '''    private static final float MAX_LINEAR_SPEED_MPS = 0.25f;\n    private static final float MAX_ANGULAR_SPEED_DPS = 20.0f;\n'''
          new = '''    private static final float MAX_LINEAR_SPEED_MPS = 0.25f;\n    private static final float MAX_ANGULAR_SPEED_DPS = 20.0f;\n    private static final float MOTION_FILTER_ALPHA = 0.35f;\n'''
          if old not in s:
              raise SystemExit('Dataset motion constants anchor not found')
          s = s.replace(old, new, 1)

          old = '''    private Pose lastRequestedPose;\n    private long lastRequestedTimestampNs = -1L;\n    private boolean captureInFlight;\n'''
          new = '''    private Pose lastRequestedPose;\n    private long lastRequestedTimestampNs = -1L;\n    private float filteredLinearSpeedMps;\n    private float filteredAngularSpeedDps;\n    private boolean hasFilteredMotion;\n    private boolean captureInFlight;\n'''
          if old not in s:
              raise SystemExit('Dataset motion fields anchor not found')
          s = s.replace(old, new, 1)

          # Reset filtered motion state across camera lifecycle boundaries.
          s = s.replace('''        lastRequestedPose = null;\n        lastRequestedTimestampNs = -1L;\n        poseSamples.clear();\n''', '''        lastRequestedPose = null;\n        lastRequestedTimestampNs = -1L;\n        resetMotionFilterLocked();\n        poseSamples.clear();\n''', 1)
          s = s.replace('''        lastRequestedPose = null;\n        lastRequestedTimestampNs = -1L;\n        lastDecision = captureEnabled ? "camera paused" : "capture stopped; finalizing";\n''', '''        lastRequestedPose = null;\n        lastRequestedTimestampNs = -1L;\n        resetMotionFilterLocked();\n        lastDecision = captureEnabled ? "camera paused" : "capture stopped; finalizing";\n''', 1)

          old = '        Motion motion = measureMotion(pose, timestampNs);\n'
          new = '        Motion motion = filterMotionLocked(measureMotion(pose, timestampNs));\n'
          if old not in s:
              raise SystemExit('Dataset onArFrame motion anchor not found')
          s = s.replace(old, new, 1)

          anchor = '''    private Motion measureMotion(Pose pose, long timestampNs) {\n'''
          helper = '''    private Motion filterMotionLocked(Motion raw) {\n        if (!hasFilteredMotion) {\n            filteredLinearSpeedMps = raw.linearSpeedMps;\n            filteredAngularSpeedDps = raw.angularSpeedDps;\n            hasFilteredMotion = true;\n        } else {\n            filteredLinearSpeedMps += MOTION_FILTER_ALPHA\n                    * (raw.linearSpeedMps - filteredLinearSpeedMps);\n            filteredAngularSpeedDps += MOTION_FILTER_ALPHA\n                    * (raw.angularSpeedDps - filteredAngularSpeedDps);\n        }\n        return new Motion(filteredLinearSpeedMps, filteredAngularSpeedDps);\n    }\n\n    private void resetMotionFilterLocked() {\n        filteredLinearSpeedMps = 0f;\n        filteredAngularSpeedDps = 0f;\n        hasFilteredMotion = false;\n    }\n\n    private Motion measureMotion(Pose pose, long timestampNs) {\n'''
          if anchor not in s:
              raise SystemExit('Dataset motion helper anchor not found')
          s = s.replace(anchor, helper, 1)
          p.write_text(s)

          # Library: do not place the header underneath the status bar/cutout.
          p = Path('app/src/main/java/com/sktpj/pointcloudsplatting/LibraryActivity.java')
          s = p.read_text()
          old = '''        emptyView=new TextView(this);emptyView.setText("保存したスキャンはまだありません\\n\\n撮影画面で対象の周りを撮影し、\\n「撮影を保存」を押してください。");emptyView.setTextColor(0xFFCCCCCC);emptyView.setTextSize(17f);emptyView.setGravity(Gravity.CENTER);emptyView.setPadding(dp(24),dp(24),dp(24),dp(24));content.addView(emptyView,new FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT,FrameLayout.LayoutParams.MATCH_PARENT));return root;\n'''
          new = '''        emptyView=new TextView(this);emptyView.setText("保存したスキャンはまだありません\\n\\n撮影画面で対象の周りを撮影し、\\n「撮影を保存」を押してください。");emptyView.setTextColor(0xFFCCCCCC);emptyView.setTextSize(17f);emptyView.setGravity(Gravity.CENTER);emptyView.setPadding(dp(24),dp(24),dp(24),dp(24));content.addView(emptyView,new FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT,FrameLayout.LayoutParams.MATCH_PARENT));\n        root.setOnApplyWindowInsetsListener((view,insets)->{int top=insets.getSystemWindowInsetTop(),bottom=insets.getSystemWindowInsetBottom(),left=insets.getSystemWindowInsetLeft(),right=insets.getSystemWindowInsetRight();if(android.os.Build.VERSION.SDK_INT>=28&&insets.getDisplayCutout()!=null){android.view.DisplayCutout c=insets.getDisplayCutout();top=Math.max(top,c.getSafeInsetTop());bottom=Math.max(bottom,c.getSafeInsetBottom());left=Math.max(left,c.getSafeInsetLeft());right=Math.max(right,c.getSafeInsetRight());}root.setPadding(left,top+dp(12),right,bottom+dp(8));return insets;});root.post(root::requestApplyInsets);return root;\n'''
          if old not in s:
              raise SystemExit('Library root anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Viewer: keep top controls and bottom size slider clear of system UI while leaving GL full-screen.
          p = Path('app/src/main/java/com/sktpj/pointcloudsplatting/GaussianViewerActivity.java')
          s = p.read_text()
          anchor = '''        root.addView(sizePanel, sizeParams);\n\n        setContentView(root);\n'''
          replacement = '''        root.addView(sizePanel, sizeParams);\n\n        root.setOnApplyWindowInsetsListener((view, insets) -> {\n            int topInset = insets.getSystemWindowInsetTop();\n            int bottomInset = insets.getSystemWindowInsetBottom();\n            int leftInset = insets.getSystemWindowInsetLeft();\n            int rightInset = insets.getSystemWindowInsetRight();\n            if (android.os.Build.VERSION.SDK_INT >= 28 && insets.getDisplayCutout() != null) {\n                android.view.DisplayCutout cutout = insets.getDisplayCutout();\n                topInset = Math.max(topInset, cutout.getSafeInsetTop());\n                bottomInset = Math.max(bottomInset, cutout.getSafeInsetBottom());\n                leftInset = Math.max(leftInset, cutout.getSafeInsetLeft());\n                rightInset = Math.max(rightInset, cutout.getSafeInsetRight());\n            }\n            FrameLayout.LayoutParams tp = (FrameLayout.LayoutParams) top.getLayoutParams();\n            tp.leftMargin = leftInset + dp(8);\n            tp.rightMargin = rightInset + dp(8);\n            tp.topMargin = topInset + dp(16);\n            top.setLayoutParams(tp);\n            FrameLayout.LayoutParams sp = (FrameLayout.LayoutParams) sizePanel.getLayoutParams();\n            sp.leftMargin = leftInset + dp(8);\n            sp.rightMargin = rightInset + dp(8);\n            sp.bottomMargin = bottomInset + dp(12);\n            sizePanel.setLayoutParams(sp);\n            return insets;\n        });\n        root.post(root::requestApplyInsets);\n\n        setContentView(root);\n'''
          if anchor not in s:
              raise SystemExit('Viewer inset anchor not found')
          s = s.replace(anchor, replacement, 1)
          p.write_text(s)

          # Processing screen: centered content still gets safe-area padding for cutouts/navigation.
          p = Path('app/src/main/java/com/sktpj/pointcloudsplatting/ModelProcessingActivity.java')
          s = p.read_text()
          anchor = '''        root.addView(card, cardParams);\n        setContentView(root);\n'''
          replacement = '''        root.addView(card, cardParams);\n        root.setOnApplyWindowInsetsListener((view, insets) -> {\n            int top = insets.getSystemWindowInsetTop();\n            int bottom = insets.getSystemWindowInsetBottom();\n            int left = insets.getSystemWindowInsetLeft();\n            int right = insets.getSystemWindowInsetRight();\n            if (android.os.Build.VERSION.SDK_INT >= 28 && insets.getDisplayCutout() != null) {\n                android.view.DisplayCutout cutout = insets.getDisplayCutout();\n                top = Math.max(top, cutout.getSafeInsetTop());\n                bottom = Math.max(bottom, cutout.getSafeInsetBottom());\n                left = Math.max(left, cutout.getSafeInsetLeft());\n                right = Math.max(right, cutout.getSafeInsetRight());\n            }\n            root.setPadding(left + dp(12), top + dp(12), right + dp(12), bottom + dp(12));\n            return insets;\n        });\n        root.post(root::requestApplyInsets);\n        setContentView(root);\n'''
          if anchor not in s:
              raise SystemExit('Processing inset anchor not found')
          s = s.replace(anchor, replacement, 1)
          p.write_text(s)

          Path('version.properties').write_text('VERSION_NAME=0.8.3\\nVERSION_CODE=23\\n')
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/sktpj/pointcloudsplatting/ScannerActivity.java \
                  app/src/main/java/com/sktpj/pointcloudsplatting/DatasetCaptureManager.java \
                  app/src/main/java/com/sktpj/pointcloudsplatting/LibraryActivity.java \
                  app/src/main/java/com/sktpj/pointcloudsplatting/GaussianViewerActivity.java \
                  app/src/main/java/com/sktpj/pointcloudsplatting/ModelProcessingActivity.java \
                  version.properties
          git commit -m 'fix safe-area UI and stabilize capture motion gate'
          git push origin HEAD:${{ github.ref_name }}
