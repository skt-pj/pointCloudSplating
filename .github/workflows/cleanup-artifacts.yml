name: Keep latest Actions artifact

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-artifacts.yml'
  workflow_run:
    workflows: ["Build APK"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old artifacts and keep newest APK
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );
            const live = artifacts
              .filter((artifact) => !artifact.expired)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            if (live.length <= 1) return;
            const keep = live.find((artifact) => /(apk|release|debug)/i.test(artifact.name)) ?? live[0];
            core.info(`Keeping ${keep.name} (${keep.id})`);
            for (const artifact of live) {
              if (artifact.id === keep.id) continue;
              core.info(`Deleting ${artifact.name} (${artifact.id})`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
            }
