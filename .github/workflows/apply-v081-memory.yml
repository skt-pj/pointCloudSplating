name: Apply v0.8.1 memory mitigation

on:
  push:
    branches:
      - 'agent/**'
    paths:
      - '.github/workflows/apply-v081-memory.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'add v0.8.1 memory mitigation workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Patch scanner GL lifetime and JPEG decode peak
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          scanner = Path('app/src/main/java/com/sktpj/pointcloudsplatting/ScannerActivity.java')
          s = scanner.read_text()
          old = '        surfaceView.setPreserveEGLContextOnPause(true);\n'
          new = '''        // Do not retain the camera GL context while another Activity is doing Vulkan 3DGS.\n        // Releasing it on pause returns camera/point-cloud GPU allocations before training.\n        surfaceView.setPreserveEGLContextOnPause(false);\n'''
          if old not in s:
              raise SystemExit('ScannerActivity EGL preserve anchor not found')
          scanner.write_text(s.replace(old, new, 1))

          exporter = Path('app/src/main/java/com/sktpj/pointcloudsplatting/ColmapDatasetExporter.java')
          s = exporter.read_text()
          old = '''    private static void resizeJpeg(File source, File target, int width, int height) throws IOException {\n        BitmapFactory.Options options = new BitmapFactory.Options();\n        options.inPreferredConfig = Bitmap.Config.ARGB_8888;\n        options.inScaled = false;\n        Bitmap full = BitmapFactory.decodeFile(source.getAbsolutePath(), options);\n        if (full == null) throw new IOException("decode failed " + source.getName());\n        Bitmap scaled = full;\n        try {\n            if (full.getWidth() != width || full.getHeight() != height) {\n                scaled = Bitmap.createScaledBitmap(full, width, height, true);\n            }\n            try (FileOutputStream output = new FileOutputStream(target)) {\n                if (!scaled.compress(Bitmap.CompressFormat.JPEG, 95, output)) {\n                    throw new IOException("JPEG encode failed " + target.getName());\n                }\n            }\n        } finally {\n            if (scaled != full) scaled.recycle();\n            full.recycle();\n        }\n    }\n'''
          new = '''    private static void resizeJpeg(File source, File target, int width, int height) throws IOException {\n        BitmapFactory.Options bounds = new BitmapFactory.Options();\n        bounds.inJustDecodeBounds = true;\n        BitmapFactory.decodeFile(source.getAbsolutePath(), bounds);\n        if (bounds.outWidth <= 0 || bounds.outHeight <= 0) {\n            throw new IOException("decode bounds failed " + source.getName());\n        }\n\n        int sample = 1;\n        while (bounds.outWidth / (sample * 2) >= width\n                && bounds.outHeight / (sample * 2) >= height) {\n            sample *= 2;\n        }\n\n        BitmapFactory.Options options = new BitmapFactory.Options();\n        options.inPreferredConfig = Bitmap.Config.ARGB_8888;\n        options.inScaled = false;\n        options.inSampleSize = Math.max(1, sample);\n        Bitmap decoded = BitmapFactory.decodeFile(source.getAbsolutePath(), options);\n        if (decoded == null) throw new IOException("decode failed " + source.getName());\n        Bitmap scaled = decoded;\n        try {\n            if (decoded.getWidth() != width || decoded.getHeight() != height) {\n                scaled = Bitmap.createScaledBitmap(decoded, width, height, true);\n            }\n            try (FileOutputStream output = new FileOutputStream(target)) {\n                if (!scaled.compress(Bitmap.CompressFormat.JPEG, 95, output)) {\n                    throw new IOException("JPEG encode failed " + target.getName());\n                }\n            }\n        } finally {\n            if (scaled != decoded) scaled.recycle();\n            decoded.recycle();\n        }\n        DiagnosticLog.i(TAG, "Prepared training JPEG " + source.getName()\n                + " source=" + bounds.outWidth + "x" + bounds.outHeight\n                + " sample=" + sample + " output=" + width + "x" + height);\n    }\n'''
          if old not in s:
              raise SystemExit('ColmapDatasetExporter resizeJpeg anchor not found')
          exporter.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/sktpj/pointcloudsplatting/ScannerActivity.java app/src/main/java/com/sktpj/pointcloudsplatting/ColmapDatasetExporter.java
          git commit -m 'release scanner GPU memory before Vulkan training'
          git push origin HEAD:${{ github.ref_name }}
