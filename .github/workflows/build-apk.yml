name: Build APK

on:
  push:
    branches:
      - main
      - 'agent/**'
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK packages
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Configure Android NDK environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.1.12297006" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - name: Prepare pinned VkSplat Android backend
        run: |
          chmod +x scripts/prepare-vksplat-android.sh
          scripts/prepare-vksplat-android.sh

      - name: Apply v1.0.7 Phase 2 and UI correction
        run: python3 scripts/apply-v1.0.7-phase2-ui-fix.py

      - name: Apply v1.0.8 Phase 2 self-evaluation metrics
        run: python3 scripts/apply-v1.0.8-phase2-self-eval.py

      - name: Verify Drive diagnostics overwrite
        run: python3 scripts/verify-drive-diagnostics.py

      - name: Verify Phase 1 observation evaluation
        run: python3 scripts/verify-phase1-evaluation.py

      - name: Verify Phase 2 geometry and camera-view evaluation
        run: python3 scripts/verify-phase2-evaluation.py

      - name: Verify Phase 2 self-evaluation metrics
        run: python3 scripts/verify-phase2-self-eval.py

      - name: Verify Phase 2 user-facing UI
        run: python3 scripts/verify-phase2-ui-ux.py

      - name: Verify mobile trainer architecture
        run: python3 scripts/verify-mobile-trainer.py

      - name: Verify mobile radix stability
        run: python3 scripts/verify-radix-stability.py

      - name: Verify resumable 3DGS training
        run: python3 scripts/verify-resumable-training.py

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable development signing key
        run: base64 --decode ci/pointcloud-dev.jks.b64 > ci/pointcloud-dev.jks

      - name: Apply app version
        run: |
          source version.properties
          sed -i -E "s/versionCode [0-9]+/versionCode ${VERSION_CODE}/" app/build.gradle
          sed -i -E "s/versionName '[^']+'/versionName '${VERSION_NAME}'/" app/build.gradle
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload versioned APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pointCloudSplating-v${{ env.VERSION_NAME }}-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Persist v1.0.8 corrected Java sources
        if: github.ref == 'refs/heads/agent/v1.0.8-phase2-self-eval'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/sktpj/pointcloudsplatting/Phase2DatasetEvaluator.java \
            app/src/main/java/com/sktpj/pointcloudsplatting/ModelProcessingCoordinator.java \
            app/src/main/java/com/sktpj/pointcloudsplatting/ScannerActivity.java \
            app/src/main/java/com/sktpj/pointcloudsplatting/GaussianSplatJob.java \
            app/src/main/java/com/sktpj/pointcloudsplatting/LibraryActivity.java
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "apply v1.0.8 phase2 self evaluation"
          git push origin HEAD

      - name: Publish latest and versioned APK into repository
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/pointCloudSplating-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "dist/pointCloudSplating-v${VERSION_NAME}-debug.apk"
          printf 'versionName=%s\nversionCode=%s\n' "$VERSION_NAME" "$VERSION_CODE" > dist/version.txt
          git restore app/build.gradle
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/pointCloudSplating-debug.apk "dist/pointCloudSplating-v${VERSION_NAME}-debug.apk" dist/version.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build v${VERSION_NAME} debug apk"
          git pull --rebase origin main
          git push origin HEAD:main
