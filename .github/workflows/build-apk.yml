name: Build APK

on:
  push:
    branches:
      - main
      - 'agent/**'
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable development signing key
        run: base64 --decode ci/pointcloud-dev.jks.b64 > ci/pointcloud-dev.jks

      - name: Apply app version
        run: |
          source version.properties
          sed -i -E "s/versionCode [0-9]+/versionCode ${VERSION_CODE}/" app/build.gradle
          sed -i -E "s/versionName '[^']+'/versionName '${VERSION_NAME}'/" app/build.gradle
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload versioned APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pointCloudSplating-v${{ env.VERSION_NAME }}-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish latest and versioned APK into repository
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/pointCloudSplating-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "dist/pointCloudSplating-v${VERSION_NAME}-debug.apk"
          printf 'versionName=%s\nversionCode=%s\n' "$VERSION_NAME" "$VERSION_CODE" > dist/version.txt
          git restore app/build.gradle
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/pointCloudSplating-debug.apk "dist/pointCloudSplating-v${VERSION_NAME}-debug.apk" dist/version.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build v${VERSION_NAME} debug apk"
          git pull --rebase origin main
          git push origin HEAD:main
