plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sktpj.pointcloudsplatting'
    compileSdk 35
    ndkVersion '27.1.12297006'

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        devStable {
            storeFile rootProject.file('ci/pointcloud-dev.jks')
            storePassword 'pointclouddev'
            keyAlias 'pointclouddev'
            keyPassword 'pointclouddev'
        }
    }

    defaultConfig {
        applicationId 'com.sktpj.pointcloudsplatting'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '0.3.0'

        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -O3 -fexceptions -frtti'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.devStable
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.ar:core:1.54.0'
}
