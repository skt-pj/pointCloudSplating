plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sktpj.pointcloudsplatting'
    compileSdk 35

    signingConfigs {
        devStable {
            storeFile rootProject.file('ci/pointcloud-dev.jks')
            storePassword 'pointclouddev'
            keyAlias 'pointclouddev'
            keyPassword 'pointclouddev'
        }
    }

    defaultConfig {
        applicationId 'com.sktpj.pointcloudsplatting'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.devStable
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.ar:core:1.54.0'
}
